name: Refresh Giphy cache

on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of each month
  workflow_dispatch:       # manual trigger from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # commit & push updated cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests python-dotenv

      - name: Rebuild Giphy cache
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: python scripts/build_giphy_cache.py

      - name: Commit changes if any
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/keywords.enriched.json data/summary.csv
          if git diff --cached --quiet; then
            echo "No cache changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh Giphy cache ($(date -u +%Y-%m-%d))"
          git push
